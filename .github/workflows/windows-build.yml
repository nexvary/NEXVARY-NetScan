name: Windows Build

on:
  push:
    branches: [ main, dev/foundation ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore src/NEXVARY.NetScan/NEXVARY.NetScan.csproj

      - name: Build
        run: dotnet build src/NEXVARY.NetScan/NEXVARY.NetScan.csproj -c Release --no-restore

      - name: Test
        run: dotnet test tests/NEXVARY.NetScan.Tests/NEXVARY.NetScan.Tests.csproj -c Release --logger "trx;LogFileName=tests.trx" --results-directory artifacts/tests

      - name: Publish self-contained Windows app
        run: dotnet publish src/NEXVARY.NetScan/NEXVARY.NetScan.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/publish

      - name: Verify published executable
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "artifacts/publish/NEXVARY-NetScan.exe"
          if (-not (Test-Path $exe)) { throw "Published EXE was not created." }
          $info = (Get-Item $exe).VersionInfo
          Write-Host "Published product: $($info.ProductName)"
          Write-Host "Published version: $($info.ProductVersion)"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler was not found." }
          & $iscc "installer\NEXVARY-NetScan.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed with exit code $LASTEXITCODE." }

      - name: Smoke-test installer and uninstaller
        shell: pwsh
        run: |
          $installer = Join-Path $PWD "artifacts/installer/NEXVARY-NetScan-Setup-v0.2.7.exe"
          if (-not (Test-Path $installer)) { throw "Installer was not created." }

          $testDir = Join-Path $env:TEMP "NEXVARY-NetScan-CI"
          if (Test-Path $testDir) { Remove-Item $testDir -Recurse -Force }

          $installArgs = @(
            "/VERYSILENT",
            "/SUPPRESSMSGBOXES",
            "/NORESTART",
            "/SP-",
            "/DIR=$testDir"
          )
          $p = Start-Process -FilePath $installer -ArgumentList $installArgs -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Installer returned exit code $($p.ExitCode)." }

          # A second silent install verifies in-place repair/update handling.
          $p = Start-Process -FilePath $installer -ArgumentList $installArgs -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "In-place install failed." }
          $installedExe = Join-Path $testDir "NEXVARY-NetScan.exe"
          if (-not (Test-Path $installedExe)) { throw "Installed executable was not found." }

          # The installed binary itself verifies XAML, real rows, icons and its dispatcher.
          $proof = Join-Path $PWD "artifacts/ui-proof"
          $app = Start-Process -FilePath $installedExe -ArgumentList "--verify-startup",$proof -PassThru
          if (-not $app.WaitForExit(45000)) { Stop-Process -Id $app.Id -Force; throw "Startup verification timed out (possible modal dialog)." }
          if ($app.ExitCode -ne 0 -or -not (Test-Path "$proof/startup-ok.txt")) { throw "Installed MainWindow verification failed." }
          # Also exercise the ordinary auto-scan startup; a live error dialog does not pass.
          $app = Start-Process -FilePath $installedExe -PassThru
          Start-Sleep -Seconds 8
          $app.Refresh()
          if ($app.HasExited -or $app.MainWindowHandle -eq 0 -or $app.MainWindowTitle -ne "NEXVARY NetScan") { throw "Normal startup did not open MainWindow." }
          Add-Type -AssemblyName UIAutomationClient
          $root = [System.Windows.Automation.AutomationElement]::RootElement
          $condition = [System.Windows.Automation.PropertyCondition]::new([System.Windows.Automation.AutomationElement]::ProcessIdProperty, $app.Id)
          $windows = $root.FindAll([System.Windows.Automation.TreeScope]::Children, $condition)
          foreach ($win in $windows) {
            if ($win.Current.ClassName -eq "#32770") { Stop-Process -Id $app.Id -Force; throw "Application opened a modal error dialog." }
          }
          Stop-Process -Id $app.Id -Force
          Start-Sleep -Seconds 1

          $uninstaller = Join-Path $testDir "unins000.exe"
          if (-not (Test-Path $uninstaller)) { throw "Uninstaller was not created." }

          $u = Start-Process -FilePath $uninstaller -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -PassThru -Wait
          if ($u.ExitCode -ne 0) { throw "Uninstaller returned exit code $($u.ExitCode)." }

          if (Test-Path $installedExe) { throw "Uninstall left the installed EXE behind." }
          Write-Host "Installer smoke test passed."

      - name: Hash deliverables
        shell: pwsh
        run: |
          Get-FileHash artifacts/publish/NEXVARY-NetScan.exe,artifacts/installer/*.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  $([IO.Path]::GetFileName($_.Path))" } | Set-Content artifacts/SHA256SUMS.txt

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NetScan-verification
          path: |
            artifacts/ui-proof/
            artifacts/tests/
            artifacts/SHA256SUMS.txt

      - name: Upload portable Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: NEXVARY-NetScan-portable-win-x64
          path: artifacts/publish/
          if-no-files-found: error

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: NEXVARY-NetScan-Setup-v0.2.7
          path: artifacts/installer/NEXVARY-NetScan-Setup-v0.2.7.exe
          if-no-files-found: error

      - name: Publish verified release downloads
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev/foundation'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.2.7 artifacts/publish/NEXVARY-NetScan.exe artifacts/installer/NEXVARY-NetScan-Setup-v0.2.7.exe artifacts/SHA256SUMS.txt --target $env:GITHUB_SHA --title "NEXVARY NetScan 0.2.7" --notes-file docs/RELEASE-0.2.7.md
          if ($LASTEXITCODE -ne 0) { throw "Release publication failed." }
